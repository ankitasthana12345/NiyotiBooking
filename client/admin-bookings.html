<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/admin-dashboard.html">Booking Admin</a>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-primary btn-sm" href="/admin-availability.html">Availability</a>
          <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h3 mb-3">Booking Management</h1>
      <div id="feedback" class="mb-3"></div>
      <div class="card p-3 mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Status</label>
            <select id="statusFilter" class="form-select">
              <option value="">All</option>
              <option>CONFIRMED</option>
              <option>REJECTED</option>
              <option>RESCHEDULED</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Search</label>
            <input id="q" class="form-control" placeholder="Customer name, contact number, or email" />
          </div>
          <div class="col-md-2 d-grid">
            <button id="searchBtn" class="btn btn-primary">Search</button>
          </div>
        </div>
      </div>

      <div class="card p-3">
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead><tr><th>Customer Name</th><th>Email</th><th>Contact Number</th><th>Date</th><th>Start Time</th><th>Actions</th></tr></thead>
            <tbody id="bookingsBody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="/js/format-utils.js"></script>
    <script src="/js/bookings.js"></script>
  </body>
</html>
