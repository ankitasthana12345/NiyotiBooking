<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/admin-dashboard.html">Booking Admin</a>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-primary btn-sm" href="/admin-availability.html">Availability</a>
          <a class="btn btn-outline-primary btn-sm" href="/admin-bookings.html">Bookings</a>
          <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h3">Event Configuration</h1>
      <div id="feedback" class="mb-3"></div>
      <form id="eventForm" class="card p-3 mb-4">
        <input type="hidden" id="eventId" />
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Title</label><input id="title" class="form-control" required /></div>
          <div class="col-md-6"><label class="form-label">Duration</label><select id="durationMinutes" class="form-select"><option>15</option><option selected>30</option><option>45</option><option>60</option><option>90</option><option>120</option></select></div>
          <div class="col-12"><label class="form-label">Description</label><textarea id="description" class="form-control" rows="2"></textarea></div>
          <div class="col-md-3"><label class="form-label">Buffer Before</label><input id="bufferBeforeMinutes" type="number" min="0" class="form-control" value="0" /></div>
          <div class="col-md-3"><label class="form-label">Buffer After</label><input id="bufferAfterMinutes" type="number" min="0" class="form-control" value="0" /></div>
          <div class="col-md-3"><label class="form-label">Meeting Platform</label><select id="meetingPlatform" class="form-select"><option>Google Meet</option><option>Zoom</option><option>Microsoft Teams</option><option>Custom</option></select></div>
          <div class="col-md-3"><label class="form-label">Meeting Link</label><input id="meetingLink" class="form-control" placeholder="https://..." /></div>
          <div class="col-md-3"><label class="form-label">Price</label><input id="price" type="number" min="0" step="0.01" class="form-control" value="0" /></div>
          <div class="col-md-2"><label class="form-label">Currency</label><input id="currency" class="form-control" value="INR" /></div>
          <div class="col-md-4"><label class="form-label">Notification Email</label><input id="notificationEmail" type="email" class="form-control" /></div>
          <div class="col-md-3 d-flex align-items-end"><div class="form-check"><input id="isPaid" class="form-check-input" type="checkbox" /><label class="form-check-label" for="isPaid">Paid Event</label></div></div>
          <div class="col-md-3 d-flex align-items-end"><div class="form-check"><input id="requiresApproval" class="form-check-input" type="checkbox" /><label class="form-check-label" for="requiresApproval">Requires Approval</label></div></div>
          <div class="col-md-3 d-flex align-items-end"><div class="form-check"><input id="isActive" class="form-check-input" type="checkbox" checked /><label class="form-check-label" for="isActive">Active</label></div></div>
          <div class="col-12"><button class="btn btn-primary" type="submit">Save Event</button></div>
        </div>
      </form>

      <div class="card p-3">
        <h2 class="h5">Events</h2>
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead><tr><th>ID</th><th>Title</th><th>Duration</th><th>Platform</th><th>Price</th><th>Approval</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="eventsBody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="/js/format-utils.js"></script>
    <script src="/js/events.js"></script>
  </body>
</html>
