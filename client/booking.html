<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Consultation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/booking.css" />
  </head>
  <body>
    <header class="hero py-5 booking-hero">
      <div class="container d-flex justify-content-between align-items-end flex-wrap gap-2">
        <div>
          <h1 class="display-6 fw-bold mb-1">Consultation Booking</h1>
          <p class="lead mb-0">Select only admin-approved slots and submit your booking.</p>
        </div>
      </div>
    </header>

    <main class="container py-4">
      <div class="row g-4">
        <section class="col-12">
          <div class="card shadow-sm mb-4">
            <div class="card-body d-flex flex-wrap align-items-center gap-4">
              <img
                src="/images/niyoti-shrivastava-square.jpg"
                alt="Niyoti Shrivastava"
                class="rounded-3 flex-shrink-0"
                style="width: 190px; height: 190px; object-fit: cover; object-position: top center"
              />
              <div>
                <h2 class="display-6 fw-bold mb-1">Niyoti Shrivastava</h2>
                <p class="text-muted mb-0">Love & Relationship Coach — helping you build deeper, lasting connections, one honest conversation at a time.</p>
              </div>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5">Booking Details</h2>
              <form id="bookingForm" class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="customerName">Full Name</label>
                  <div class="input-group">
                    <select id="title" class="form-select flex-grow-0 w-auto" required>
                      <option value="">Title</option>
                      <option value="Mr.">Mr.</option>
                      <option value="Mrs.">Mrs.</option>
                      <option value="Ms.">Ms.</option>
                      <option value="Miss">Miss</option>
                    </select>
                    <input id="customerName" class="form-control" required />
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="customerEmail">Email Address</label>
                  <input id="customerEmail" type="email" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="phoneNumber">Phone Number</label>
                  <div class="input-group">
                    <select id="countryCode" class="form-select flex-grow-0 w-auto" required></select>
                    <input id="phoneNumber" class="form-control" required />
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="gender">Gender</label>
                  <select id="gender" class="form-select" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Non-binary">Non-binary</option>
                    <option value="Prefer not to say">Prefer not to say</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="profession">Profession</label>
                  <select id="profession" class="form-select" required></select>
                  <input id="professionOther" class="form-control mt-2 d-none" maxlength="100" placeholder="Type your profession" aria-label="Type your profession" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="availableDateSelect">Available Date</label>
                  <select id="availableDateSelect" class="form-select" required></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="availableTimeSelect">Available Time</label>
                  <select id="availableTimeSelect" class="form-select" required></select>
                </div>
                <div class="col-12">
                  <label class="form-label" for="message">Question</label>
                  <textarea id="message" class="form-control" rows="3" required></textarea>
                </div>
                <div class="col-12">
                  <button class="btn btn-primary" type="submit">Submit Booking</button>
                </div>
              </form>
              <div id="bookingFeedback" class="mt-3"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="/js/format-utils.js"></script>
    <script src="/js/professions.js"></script>
    <script src="/js/booking.js"></script>
  </body>
</html>
