<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/admin-dashboard.html">Booking Admin</a>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-primary btn-sm" href="/admin-availability.html">Manage Availability</a>
          <a class="btn btn-outline-primary btn-sm" href="/admin-bookings.html">View Bookings</a>
          <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h3 mb-3">Dashboard</h1>
      <div id="metrics" class="row g-3"></div>
      <div class="card mt-4">
        <div class="card-body">
          <h2 class="h5">Recent Bookings (Top 10)</h2>
          <div class="table-responsive">
            <table class="table table-striped align-middle">
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Email</th>
                  <th>Time</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="recentBookingsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script src="/js/format-utils.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>
