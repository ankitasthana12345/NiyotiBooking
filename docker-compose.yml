services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    volumes:
      - ./server/logs:/app/server/logs
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_NAME:-AppointmentBookingDB}"
      MYSQL_USER: "${DB_USER:-app}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-change_me_local}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-change_me_root}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
